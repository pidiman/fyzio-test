services:
  web:
    build: .
    container_name: fyzio-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
    # len pre lokálny test na serveri (curl http://127.0.0.1:8092), verejne ide cez Caddy
    ports:
      - "127.0.0.1:8092:3000"
    # smtp-relay s portom zverejneným na hostiteľovi je dostupný ako host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - fyzio-data:/app/data
    networks:
      - web

networks:
  web:
    external: true

volumes:
  fyzio-data:
